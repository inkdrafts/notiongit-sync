# Reusable GitHub Action wrapping the Notion → Jekyll sync engine.
#
# Consumers run this from their own site repository (after actions/checkout):
#
#     - uses: inkdrafts/notiongit-sync@v1
#       with:
#         notion_token: ${{ secrets.NOTION_TOKEN }}
#         pages_database_id: ${{ vars.PAGES_DATABASE_ID }}
#         posts_database_id: ${{ vars.POSTS_DATABASE_ID }}
#
# The engine runs with Bun against the consumer's checkout ($GITHUB_WORKSPACE),
# not this action's own copy under _actions/ — SITE_ROOT below points its
# writes (_pages/, _posts/, _data/, _config.yml) at the workspace.
#
# The sync step below runs the committed dist/index.js bundle, not
# scripts/sync-notion.js directly, so consumer workflows never run
# `bun install` — see dist/README.md for how the bundle is produced.

name: 'Notion → Jekyll Sync'
description: >-
  Syncs published pages and posts from two Notion databases into a Jekyll site
  checkout: _pages/, _posts/, _data/nav.yml, _data/home.yml, and the title /
  author.name lines of _config.yml. Aborts on suspicious bulk deletes.

inputs:
  notion_token:
    description: >-
      Notion integration secret. Treated as a credential: never printed, never
      included in outputs.
    required: true
  pages_database_id:
    description: 'ID of the Notion pages database. Empty → pages sync skipped.'
    required: false
    default: ''
  posts_database_id:
    description: >-
      ID of the Notion posts database. Empty → posts sync skipped, unless the
      legacy NOTION_DATABASE_ID environment variable is set (still honored).
    required: false
    default: ''
  allow_bulk_delete:
    description: >-
      true to allow a sync that deletes every tracked file. By default the run
      aborts when Notion returns zero published rows or a deletion exceeds
      MAX_DELETE_RATIO (environment variable, default 0.5). "true" in any case
      spelling is accepted.
    required: false
    default: 'false'

outputs:
  changed:
    description: >-
      "true" when any tracked file was created, updated, renamed or deleted
      this run — including _data/nav.yml, _data/home.yml and the managed lines
      of _config.yml. Independent of success/failure: a run that fails partway
      through (some rows errored) can still report "true" for the files it
      did write before failing. "false" when nothing was ever written. Every
      terminal outcome emits this output.
    value: ${{ steps.sync.outputs.changed }}
  summary:
    description: >-
      Compact, non-secret JSON run summary (schema_version 1) — the same
      contract for every terminal outcome (success, no-op, a guarded
      deletion, or an unexpected sync error). See docs/run-summary-schema.md
      for the field reference and schema/run-summary.v1.json for the formal
      schema. A human-readable Markdown rendering of the same data is also appended
      to $GITHUB_STEP_SUMMARY.
    value: ${{ steps.sync.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: 'Set up Bun'
      uses: oven-sh/setup-bun@v2

    - name: 'Run Notion → Jekyll sync'
      id: sync
      shell: bash
      run: bun dist/index.js
      working-directory: ${{ github.action_path }}
      env:
        NOTION_TOKEN: ${{ inputs.notion_token }}
        NOTION_PAGES_DATABASE_ID: ${{ inputs.pages_database_id }}
        NOTION_POSTS_DATABASE_ID: ${{ inputs.posts_database_id }}
        ALLOW_BULK_DELETE: ${{ inputs.allow_bulk_delete }}
        SITE_ROOT: ${{ github.workspace }}
