name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # so release.yml can require the same checks before tagging

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dist/ must rebuild bit-for-bit for the staleness check below to mean
      # anything, and bun's minifier output changes between releases (the
      # identifier-suffix style changed under us on 2026-09-05, breaking this
      # check repo-wide). Pin the version that builds the committed bundle.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild dist/
        run: bun run build

      - name: Fail if dist/ is stale (source changed without regenerating it)
        run: git diff --exit-code

      - name: Test
        run: bun test
