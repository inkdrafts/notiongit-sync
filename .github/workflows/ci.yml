name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild dist/
        run: bun run build

      - name: Fail if dist/ is stale (source changed without regenerating it)
        run: git diff --exit-code

      - name: Test
        run: bun test
