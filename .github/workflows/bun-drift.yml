name: Bun toolchain drift

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild dist/
        run: bun run build

      - name: Fail if latest Bun changes dist/
        run: git diff --exit-code -- dist/index.js

      - name: Test
        run: bun test
