# Cuts an immutable vX.Y.Z release and moves that major's alias — see RELEASING.md.
#
# Full-version tags are never recreated or moved once pushed; the release
# creates and moves only its own major's alias (v1 for a 1.x release, v2 for
# a 2.x release), and only after the same checks CI runs on every push pass
# again here.
#
# Usage: Actions -> Release -> Run workflow, on `main`, with:
#   version: full semver to release, no leading v (e.g. 1.2.0)
#   dry_run: true (default) runs every check with nothing tagged, pushed, or
#            published; false performs the real release.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full semantic version to release, no leading v (e.g. 1.2.0)'
        required: true
        type: string
      dry_run:
        description: >-
          true (default): run every check and rebuild dist/, but tag, push,
          and publish nothing. Only set to false when you mean to release.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The same build-and-test job CI runs on every push/PR, required to pass
  # again on the release commit before anything below may tag or publish.
  verify:
    uses: ./.github/workflows/ci.yml

  validate-inputs:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Releases are cut from main
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Release was dispatched from $REF, not main"
            exit 1
          fi

      - name: Version must be a full semantic version (X.Y.Z, no leading v)
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$VERSION' is not a full semver like 1.2.0"; exit 1; }

      - name: Full-version tags are immutable — this one must not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists — full-version tags are never recreated or moved, release a new version instead"
            exit 1
          fi

      - name: CHANGELOG.md must document this version
        run: |
          grep -qE "^## \[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — add release notes before releasing"; exit 1; }

  release:
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job tags, pushes, and publishes a release
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pin as ci.yml: dist/ must rebuild bit-for-bit, and bun's minifier
      # output changes between releases.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild dist/ so the tagged commit's bundle is provably current
        run: bun run build

      - name: Fail if dist/ is stale
        run: git diff --exit-code

      - name: Test
        run: bun test

      - name: Extract this version's release notes from CHANGELOG.md
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "(see CHANGELOG.md)" > RELEASE_NOTES.md

      - name: Create the immutable version tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - name: Move the major alias to the new release
        if: ${{ !inputs.dry_run }}
        run: |
          MAJOR="${VERSION%%.*}"
          git tag -f "v$MAJOR" "v$VERSION"
          git push origin "refs/tags/v$MAJOR" --force

      - name: Publish the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md

      - name: Dry run — nothing was tagged, pushed, or published
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run OK for v$VERSION: tests passed, dist/ is current, CHANGELOG.md has release notes."
          echo '---'
          cat RELEASE_NOTES.md
          echo '---'
          echo "Re-run with dry_run=false to tag v$VERSION, move its major alias to it, and publish the GitHub release."
